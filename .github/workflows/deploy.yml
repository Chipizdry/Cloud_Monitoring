
name: Deploy

on:
  push:
    branches:
      - main
      # Не игнорируем version.py, иначе workflow не будет срабатывать на пуш после инкремента
      # paths-ignore:
      #   - 'backend/version.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Клонируем репозиторий с полной историей
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          persist-credentials: false

      # 2️⃣ Инкрементируем build number
      - name: Increment build number
        id: build
        run: |
          VERSION_FILE="backend/version.py"
          DEFAULT_MAJOR=0
          DEFAULT_MINOR=1

          if [ -f "$VERSION_FILE" ]; then
            CURRENT_VERSION=$(grep "__version__" $VERSION_FILE | sed -E "s/__version__='([0-9]+\.[0-9]+\.[0-9]+)'/\1/")
            if [[ -z "$CURRENT_VERSION" ]]; then
              MAJOR=$DEFAULT_MAJOR
              MINOR=$DEFAULT_MINOR
              BUILD=0
            else
              MAJOR=$(echo $CURRENT_VERSION | cut -d. -f1)
              MINOR=$(echo $CURRENT_VERSION | cut -d. -f2)
              BUILD=$(echo $CURRENT_VERSION | cut -d. -f3)
            fi
            BUILD=$((BUILD + 1))
          else
            MAJOR=$DEFAULT_MAJOR
            MINOR=$DEFAULT_MINOR
            BUILD=1
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${BUILD}"
          echo "VERSION=$NEW_VERSION" >> $GITHUB_ENV

          # Правильная запись в version.py
          echo "__version__='${NEW_VERSION}'" > $VERSION_FILE
          echo "✅ New version: $NEW_VERSION"
          cat $VERSION_FILE

      # 3️⃣ Коммитим и пушим version.py обратно в main
      - name: Commit and push version file
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/version.py
          # Коммитим только если есть реальные изменения
          git diff --cached --quiet || git commit -m "🔼 Auto bump version to ${VERSION}"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:main

      # 4️⃣ Устанавливаем зависимости
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 5️⃣ Деплой
      - name: Deploy
        run: |
          echo "🚀 Deploying version $VERSION"
